services:
  postgres:
    image: postgres:16-alpine
    container_name: flowly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowly
      POSTGRES_PASSWORD: flowly
      POSTGRES_DB: flowly
    ports:
      - '5432:5432'
    volumes:
      - flowly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowly -d flowly']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  flowly_pgdata:
