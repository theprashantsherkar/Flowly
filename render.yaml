# Render Blueprint for Flowly's two Node services (API + collab).
# The web app deploys separately on Vercel (see apps/web/vercel.json + DEPLOY.md).
# Point DATABASE_URL at your Neon database; add the Clerk *production* keys.
#
# Each service's own `build` script runs `prisma generate` and compiles with tsc,
# so the build works from the repo root or with a per-service root directory.

services:
  - type: web
    name: flowly-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build --workspace @flowly/api
    preDeployCommand: npm run prisma:deploy --workspace @flowly/api
    startCommand: npm run start --workspace @flowly/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false

  - type: web
    name: flowly-collab
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build --workspace @flowly/collab
    startCommand: npm run start --workspace @flowly/collab
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
